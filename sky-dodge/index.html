<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKY // DODGE</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  canvas {
    background: #000;
    border: 2px solid #fff;
    width: min(92vw, 480px);
    height: auto;
    aspect-ratio: 480 / 640;
    image-rendering: pixelated;
  }
  #hint { color: #fff; font-size: 12px; letter-spacing: 1px; opacity: 0.6; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="hint">SPACE, UP ARROW, OR CLICK TO FLAP</div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;

  // ---------------------------------------------------------------
  // High score
  // ---------------------------------------------------------------
  var HIGH_SCORE_KEY = "skyDodgeHighScore";
  var highScore = 0;
  try { highScore = parseInt(localStorage.getItem(HIGH_SCORE_KEY), 10) || 0; } catch (e) { highScore = 0; }
  function saveHighScore(s) {
    if (s > highScore) {
      highScore = s;
      try { localStorage.setItem(HIGH_SCORE_KEY, String(highScore)); } catch (e) { /* ignore */ }
    }
  }

  // ---------------------------------------------------------------
  // State machine
  // ---------------------------------------------------------------
  var STATE_START = "start", STATE_PLAYING = "playing", STATE_GAMEOVER = "gameover";
  var state = STATE_START;
  var score = 0;

  // ---------------------------------------------------------------
  // World
  // ---------------------------------------------------------------
  var GROUND_Y = H - 36;
  var GRAVITY = 1500;
  var FLAP_V = -420;
  var MAX_FALL = 620;

  var bird = { x: 120, y: H / 2, vy: 0, r: 11, tilt: 0 };

  var PIPE_W = 58;
  var GAP_START = 190, GAP_MIN = 138;
  var SPEED_START = 180, SPEED_MAX = 320;
  var PIPE_SPACING = 260; // horizontal px between pipe pairs

  var pipes = []; // {x, gapY, gapH, scored}
  var particles = [];
  var stars = [];
  for (var si = 0; si < 50; si++) {
    stars.push({ x: Math.random() * W, y: Math.random() * (GROUND_Y - 10), r: Math.random() * 1.3 + 0.3, tw: Math.random() * Math.PI * 2 });
  }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function difficultyT() {
    // 0..1 ramp based on score, maxing out around score 25
    return clamp(score / 25, 0, 1);
  }
  function currentGapH() { return GAP_START - (GAP_START - GAP_MIN) * difficultyT(); }
  function currentSpeed() { return SPEED_START + (SPEED_MAX - SPEED_START) * difficultyT(); }

  function spawnPipe(xPos) {
    var gapH = currentGapH();
    var margin = 60;
    var gapY = rand(margin + gapH / 2, GROUND_Y - margin - gapH / 2);
    pipes.push({ x: xPos, gapY: gapY, gapH: gapH, scored: false });
  }

  function spawnParticles(x, y, count) {
    for (var i = 0; i < count; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = rand(30, 140);
      particles.push({ x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 0.4, maxLife: 0.4 });
    }
  }

  function resetGame() {
    score = 0;
    bird.x = 120; bird.y = H / 2; bird.vy = 0; bird.tilt = 0;
    pipes = [];
    particles.length = 0;
    spawnPipe(W + 120);
    spawnPipe(W + 120 + PIPE_SPACING);
    spawnPipe(W + 120 + PIPE_SPACING * 2);
    state = STATE_PLAYING;
  }

  function flap() {
    bird.vy = FLAP_V;
  }

  function onAction() {
    if (state === STATE_START) { resetGame(); flap(); return; }
    if (state === STATE_GAMEOVER) { resetGame(); flap(); return; }
    if (state === STATE_PLAYING) { flap(); return; }
  }

  // ---------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------
  function isActionKey(code) {
    return code === "Space" || code === "ArrowUp" || code === "KeyW";
  }
  window.addEventListener("keydown", function (e) {
    if (isActionKey(e.code)) { e.preventDefault(); onAction(); }
  });
  canvas.addEventListener("mousedown", function () { onAction(); });
  canvas.addEventListener("touchstart", function (e) { e.preventDefault(); onAction(); }, { passive: false });

  // ---------------------------------------------------------------
  // Collision
  // ---------------------------------------------------------------
  function circleRectHit(cx, cy, cr, rx, ry, rw, rh) {
    var closestX = clamp(cx, rx, rx + rw);
    var closestY = clamp(cy, ry, ry + rh);
    var dx = cx - closestX, dy = cy - closestY;
    return (dx * dx + dy * dy) < (cr * cr);
  }

  function die() {
    state = STATE_GAMEOVER;
    saveHighScore(score);
    spawnParticles(bird.x, bird.y, 20);
  }

  // ---------------------------------------------------------------
  // Update
  // ---------------------------------------------------------------
  function update(dt) {
    updateParticles(dt);
    if (state !== STATE_PLAYING) return;

    bird.vy += GRAVITY * dt;
    bird.vy = Math.min(bird.vy, MAX_FALL);
    bird.y += bird.vy * dt;
    bird.tilt = clamp(bird.vy / MAX_FALL, -0.5, 1.0);

    if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }
    if (bird.y + bird.r > GROUND_Y) { bird.y = GROUND_Y - bird.r; die(); return; }

    var speed = currentSpeed();
    for (var i = pipes.length - 1; i >= 0; i--) {
      var p = pipes[i];
      p.x -= speed * dt;

      // collision against top and bottom pipe rects
      var topH = p.gapY - p.gapH / 2;
      var botY = p.gapY + p.gapH / 2;
      if (circleRectHit(bird.x, bird.y, bird.r, p.x, 0, PIPE_W, topH) ||
          circleRectHit(bird.x, bird.y, bird.r, p.x, botY, PIPE_W, GROUND_Y - botY)) {
        die();
        return;
      }

      if (!p.scored && p.x + PIPE_W < bird.x) {
        p.scored = true;
        score += 1;
      }

      if (p.x + PIPE_W < -20) pipes.splice(i, 1);
    }

    // keep pipes flowing
    var lastX = pipes.length ? pipes[pipes.length - 1].x : -Infinity;
    if (lastX < W - PIPE_SPACING + 40) spawnPipe(lastX + PIPE_SPACING);
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var q = particles[i];
      q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
      if (q.life <= 0) particles.splice(i, 1);
    }
  }

  // ---------------------------------------------------------------
  // Draw
  // ---------------------------------------------------------------
  function drawStars(t) {
    ctx.fillStyle = "#fff";
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = 0.3 + 0.3 * Math.sin(t * 2 + s.tw);
      ctx.globalAlpha = Math.max(0, a);
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawGround() {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(W, GROUND_Y);
    ctx.stroke();
    // hatch marks along the ground for texture
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.5;
    for (var x = 0; x < W; x += 14) {
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 4);
      ctx.lineTo(x - 6, GROUND_Y + 12);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawPipe(p) {
    var topH = p.gapY - p.gapH / 2;
    var botY = p.gapY + p.gapH / 2;
    ctx.fillStyle = "#fff";
    ctx.fillRect(p.x, 0, PIPE_W, topH);
    ctx.fillRect(p.x, botY, PIPE_W, GROUND_Y - botY);
    // lip caps for a classic pipe silhouette
    ctx.fillRect(p.x - 4, topH - 16, PIPE_W + 8, 16);
    ctx.fillRect(p.x - 4, botY, PIPE_W + 8, 16);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.tilt * 0.6);
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
    ctx.fill();
    // simple wing notch so it doesn't read as a plain dot
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-3, 0);
    ctx.lineTo(-bird.r - 2, 3);
    ctx.stroke();
    ctx.restore();
  }

  function drawParticles() {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.5;
    for (var i = 0; i < particles.length; i++) {
      var q = particles[i];
      ctx.globalAlpha = Math.max(0, q.life / q.maxLife);
      ctx.beginPath();
      ctx.moveTo(q.x, q.y);
      ctx.lineTo(q.x - q.vx * 0.03, q.y - q.vy * 0.03);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.fillStyle = "#fff";
    ctx.font = "16px 'Courier New', monospace";
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillText("SCORE " + score, 10, 10);
    ctx.textAlign = "right";
    ctx.fillText("BEST " + Math.max(highScore, score), W - 10, 10);
  }

  function centeredText(text, y, size) {
    ctx.fillStyle = "#fff";
    ctx.font = (size || 20) + "px 'Courier New', monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(text, W / 2, y);
  }

  function drawStartScreen() {
    centeredText("SKY // DODGE", H / 2 - 90, 26);
    ctx.save();
    ctx.translate(W / 2, H / 2 - 50);
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    centeredText("SPACE, UP ARROW, OR CLICK TO FLAP", H / 2 + 6, 14);
    centeredText("THREAD EVERY GAP -- ONE HIT ENDS THE RUN", H / 2 + 30, 14);
    centeredText("PRESS ANY KEY OR CLICK TO START", H / 2 + 68, 13);
    centeredText("BEST " + highScore, H / 2 + 100, 13);
  }

  function drawGameOverScreen() {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, W, H);
    centeredText("GAME OVER", H / 2 - 30, 26);
    centeredText("SCORE " + score, H / 2 + 6, 18);
    centeredText("BEST " + highScore, H / 2 + 32, 14);
    centeredText("PRESS ANY KEY OR CLICK TO RETRY", H / 2 + 70, 13);
  }

  function draw(t) {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);
    drawStars(t);

    if (state === STATE_START) { drawGround(); drawStartScreen(); return; }

    for (var i = 0; i < pipes.length; i++) drawPipe(pipes[i]);
    drawGround();
    drawParticles();
    drawBird();
    drawHUD();

    if (state === STATE_GAMEOVER) drawGameOverScreen();
  }

  // ---------------------------------------------------------------
  // Loop
  // ---------------------------------------------------------------
  var lastTime = null;
  function loop(ts) {
    if (lastTime === null) lastTime = ts;
    var dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;
    update(dt);
    draw(ts / 1000);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
