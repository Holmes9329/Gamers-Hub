<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROCKET // DODGE</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }
  #wrap {
    display: flex; flex-direction: column; align-items: center;
    gap: 10px;
  }
  canvas {
    background: #000;
    border: 2px solid #fff;
    width: min(92vw, 480px);
    height: auto;
    aspect-ratio: 480 / 640;
    image-rendering: pixelated;
  }
  #hint {
    color: #fff;
    font-size: 12px;
    letter-spacing: 1px;
    opacity: 0.6;
    text-align: center;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="hint">ARROW KEYS / A-D TO STEER &mdash; AUTO-FIRE IS ON &mdash; PRESS ANY KEY TO START</div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;

  // ---------------------------------------------------------------
  // Persistent high score
  // ---------------------------------------------------------------
  var HIGH_SCORE_KEY = "rocketDodgeHighScore";
  var highScore = 0;
  try {
    highScore = parseInt(localStorage.getItem(HIGH_SCORE_KEY), 10) || 0;
  } catch (e) { highScore = 0; }

  function saveHighScore(score) {
    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem(HIGH_SCORE_KEY, String(highScore)); } catch (e) { /* ignore */ }
    }
  }

  // ---------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------
  var STATE_START = "start", STATE_PLAYING = "playing", STATE_GAMEOVER = "gameover";
  var state = STATE_START;

  var score = 0;
  var elapsed = 0; // seconds survived this run, drives difficulty ramp

  var player = {
    w: 34, h: 34,
    x: W / 2,
    y: H - 60,
    speed: 300, // px/sec
    baseCooldown: 0.42,
    cooldown: 0,
    invuln: 0,      // brief grace period after taking a hit
    shield: false,
    shieldTimer: 0,
    rapidTimer: 0,
    multiTimer: 0
  };

  var LIVES_MAX = 3;
  var lives = LIVES_MAX;

  var bullets = [];   // {x,y,vx,vy}
  var aliens = [];    // {x,y,r,vy}
  var powerups = [];  // {x,y,vy,type}
  var particles = []; // {x,y,vx,vy,life,maxLife}
  var stars = [];

  var keys = { left: false, right: false };

  var alienSpawnTimer = 0;
  var powerupSpawnTimer = 6; // first powerup a little later so it isn't instant

  // ---------------------------------------------------------------
  // Starfield (purely decorative, still monochrome)
  // ---------------------------------------------------------------
  for (var i = 0; i < 60; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.4 + 0.3,
      tw: Math.random() * Math.PI * 2
    });
  }

  // ---------------------------------------------------------------
  // Helpers
  // ---------------------------------------------------------------
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }

  function resetGame() {
    score = 0;
    elapsed = 0;
    lives = LIVES_MAX;
    player.x = W / 2;
    player.cooldown = 0;
    player.invuln = 0;
    player.shield = false;
    player.shieldTimer = 0;
    player.rapidTimer = 0;
    player.multiTimer = 0;
    bullets.length = 0;
    aliens.length = 0;
    powerups.length = 0;
    particles.length = 0;
    alienSpawnTimer = 0.4;
    powerupSpawnTimer = 6;
  }

  function spawnParticles(x, y, count) {
    for (var i = 0; i < count; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = rand(40, 160);
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 0.5, maxLife: 0.5
      });
    }
  }

  function currentAlienSpeed() {
    // Ramps from 70 up to 210 px/sec as the run goes on, then holds.
    return clamp(70 + elapsed * 4.5, 70, 210);
  }

  function currentSpawnInterval() {
    // Aliens come faster over time, floor at 0.4s between spawns.
    return clamp(1.15 - elapsed * 0.012, 0.4, 1.15);
  }

  // ---------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------
  function isMoveKey(code) {
    return code === "ArrowLeft" || code === "ArrowRight" || code === "KeyA" || code === "KeyD";
  }

  window.addEventListener("keydown", function (e) {
    if (isMoveKey(e.code)) e.preventDefault();
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;

    if (state === STATE_START || state === STATE_GAMEOVER) {
      state = STATE_PLAYING;
      resetGame();
    }
  });

  window.addEventListener("keyup", function (e) {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
  });

  canvas.addEventListener("mousedown", function () {
    if (state === STATE_START || state === STATE_GAMEOVER) {
      state = STATE_PLAYING;
      resetGame();
    }
  });

  // ---------------------------------------------------------------
  // Update
  // ---------------------------------------------------------------
  function fireBullets() {
    var multiActive = player.multiTimer > 0;
    if (multiActive) {
      bullets.push({ x: player.x, y: player.y - player.h / 2, vx: 0, vy: -420 });
      bullets.push({ x: player.x, y: player.y - player.h / 2, vx: -70, vy: -400 });
      bullets.push({ x: player.x, y: player.y - player.h / 2, vx: 70, vy: -400 });
    } else {
      bullets.push({ x: player.x, y: player.y - player.h / 2, vx: 0, vy: -420 });
    }
  }

  function hitPlayer(alienIndex) {
    // shield absorbs the hit entirely
    if (player.shield) {
      player.shield = false;
      player.shieldTimer = 0;
      spawnParticles(aliens[alienIndex].x, aliens[alienIndex].y, 14);
      aliens.splice(alienIndex, 1);
      player.invuln = 0.6;
      return;
    }
    spawnParticles(aliens[alienIndex].x, aliens[alienIndex].y, 18);
    aliens.splice(alienIndex, 1);
    lives -= 1;
    player.invuln = 1.3;
    if (lives <= 0) {
      state = STATE_GAMEOVER;
      saveHighScore(score);
    }
  }

  function update(dt) {
    if (state !== STATE_PLAYING) return;
    elapsed += dt;

    // --- movement ---
    if (keys.left) player.x -= player.speed * dt;
    if (keys.right) player.x += player.speed * dt;
    player.x = clamp(player.x, player.w / 2, W - player.w / 2);

    // --- timers ---
    if (player.invuln > 0) player.invuln -= dt;
    if (player.rapidTimer > 0) player.rapidTimer -= dt;
    if (player.multiTimer > 0) player.multiTimer -= dt;
    if (player.shield) {
      player.shieldTimer -= dt;
      if (player.shieldTimer <= 0) player.shield = false;
    }

    // --- auto-fire ---
    player.cooldown -= dt;
    if (player.cooldown <= 0) {
      fireBullets();
      var cd = player.baseCooldown;
      if (player.rapidTimer > 0) cd *= 0.45;
      player.cooldown = cd;
    }

    // --- bullets ---
    for (var bi = bullets.length - 1; bi >= 0; bi--) {
      var b = bullets[bi];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.y < -20 || b.x < -20 || b.x > W + 20) bullets.splice(bi, 1);
    }

    // --- alien spawning ---
    alienSpawnTimer -= dt;
    if (alienSpawnTimer <= 0) {
      alienSpawnTimer = currentSpawnInterval();
      var r = rand(14, 20);
      aliens.push({
        x: rand(r + 4, W - r - 4),
        y: -r,
        r: r,
        vy: currentAlienSpeed() + rand(-15, 15),
        wobble: rand(0, Math.PI * 2)
      });
    }

    // --- powerup spawning ---
    powerupSpawnTimer -= dt;
    if (powerupSpawnTimer <= 0) {
      powerupSpawnTimer = rand(7, 12);
      var types = ["rapid", "multi", "shield"];
      var type = types[Math.floor(Math.random() * types.length)];
      powerups.push({
        x: rand(24, W - 24),
        y: -16,
        vy: 110,
        type: type
      });
    }

    // --- aliens update + collisions ---
    for (var ai = aliens.length - 1; ai >= 0; ai--) {
      var a = aliens[ai];
      a.y += a.vy * dt;

      // vs bullets
      var hit = false;
      for (bi = bullets.length - 1; bi >= 0; bi--) {
        b = bullets[bi];
        var dx = b.x - a.x, dy = b.y - a.y;
        if (dx * dx + dy * dy < (a.r + 3) * (a.r + 3)) {
          bullets.splice(bi, 1);
          hit = true;
          break;
        }
      }
      if (hit) {
        var bonus = a.y < H / 2 ? 15 : 10;
        score += bonus;
        spawnParticles(a.x, a.y, 12);
        aliens.splice(ai, 1);
        continue;
      }

      // vs player
      if (player.invuln <= 0) {
        var pdx = a.x - player.x, pdy = a.y - player.y;
        var rad = a.r + player.w * 0.4;
        if (pdx * pdx + pdy * pdy < rad * rad) {
          hitPlayer(ai);
          continue;
        }
      }

      // off bottom of screen = successfully dodged, no penalty --
      // "kill or dodge" both count as surviving an alien.
      if (a.y - a.r > H) {
        aliens.splice(ai, 1);
      }
    }

    // --- powerups update + collection ---
    for (var pi = powerups.length - 1; pi >= 0; pi--) {
      var p = powerups[pi];
      p.y += p.vy * dt;
      var ddx = p.x - player.x, ddy = p.y - player.y;
      var rr = 16 + player.w * 0.4;
      if (ddx * ddx + ddy * ddy < rr * rr) {
        score += 5;
        if (p.type === "rapid") player.rapidTimer = 8;
        if (p.type === "multi") player.multiTimer = 8;
        if (p.type === "shield") { player.shield = true; player.shieldTimer = 10; }
        spawnParticles(p.x, p.y, 10);
        powerups.splice(pi, 1);
      } else if (p.y - 16 > H) {
        powerups.splice(pi, 1);
      }
    }

    // --- particles ---
    for (var qi = particles.length - 1; qi >= 0; qi--) {
      var q = particles[qi];
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.life -= dt;
      if (q.life <= 0) particles.splice(qi, 1);
    }
  }

  // ---------------------------------------------------------------
  // Draw
  // ---------------------------------------------------------------
  function drawStars(t) {
    ctx.fillStyle = "#fff";
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = 0.35 + 0.35 * Math.sin(t * 2 + s.tw);
      ctx.globalAlpha = Math.max(0, a);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawShip() {
    var blink = player.invuln > 0 && Math.floor(player.invuln * 12) % 2 === 0;
    if (blink) return;

    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -player.h / 2);
    ctx.lineTo(player.w / 2, player.h / 2);
    ctx.lineTo(player.w * 0.18, player.h * 0.28);
    ctx.lineTo(-player.w * 0.18, player.h * 0.28);
    ctx.lineTo(-player.w / 2, player.h / 2);
    ctx.closePath();
    ctx.stroke();
    // small engine flame flicker
    ctx.beginPath();
    var flameLen = 6 + Math.random() * 6;
    ctx.moveTo(-5, player.h / 2 - 2);
    ctx.lineTo(0, player.h / 2 - 2 + flameLen);
    ctx.lineTo(5, player.h / 2 - 2);
    ctx.stroke();
    ctx.restore();

    if (player.shield) {
      ctx.save();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.w * 0.85, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawAlien(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    var r = a.r;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.lineTo(r, 0);
    ctx.lineTo(r * 0.55, r);
    ctx.lineTo(-r * 0.55, r);
    ctx.lineTo(-r, 0);
    ctx.closePath();
    ctx.stroke();
    // eyes
    ctx.beginPath();
    ctx.arc(-r * 0.3, -r * 0.05, 1.6, 0, Math.PI * 2);
    ctx.arc(r * 0.3, -r * 0.05, 1.6, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.restore();
  }

  function drawBullet(b) {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.02, b.y + 10);
    ctx.stroke();
  }

  var POWERUP_LABEL = { rapid: "R", multi: "M", shield: "S" };

  function drawPowerup(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 13px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(POWERUP_LABEL[p.type], 0, 1);
    ctx.restore();
  }

  function drawParticles() {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.5;
    for (var i = 0; i < particles.length; i++) {
      var q = particles[i];
      ctx.globalAlpha = Math.max(0, q.life / q.maxLife);
      ctx.beginPath();
      ctx.moveTo(q.x, q.y);
      ctx.lineTo(q.x - q.vx * 0.03, q.y - q.vy * 0.03);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.fillStyle = "#fff";
    ctx.font = "16px 'Courier New', monospace";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("SCORE " + score, 10, 10);

    ctx.textAlign = "right";
    ctx.fillText("BEST " + Math.max(highScore, score), W - 10, 10);

    // lives as small triangle pips
    ctx.textAlign = "left";
    for (var i = 0; i < LIVES_MAX; i++) {
      var lx = 10 + i * 22;
      var ly = 34;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(lx, ly + 10);
      ctx.lineTo(lx + 6, ly);
      ctx.lineTo(lx + 12, ly + 10);
      ctx.closePath();
      if (i < lives) { ctx.fillStyle = "#fff"; ctx.fill(); }
      else { ctx.stroke(); }
    }

    // active powerup timers, compact text
    var y = 56;
    ctx.textAlign = "left";
    ctx.font = "11px 'Courier New', monospace";
    if (player.rapidTimer > 0) { ctx.fillText("RAPID " + player.rapidTimer.toFixed(1) + "s", 10, y); y += 14; }
    if (player.multiTimer > 0) { ctx.fillText("MULTI " + player.multiTimer.toFixed(1) + "s", 10, y); y += 14; }
    if (player.shield) { ctx.fillText("SHIELD " + player.shieldTimer.toFixed(1) + "s", 10, y); y += 14; }
  }

  function centeredText(text, y, size) {
    ctx.fillStyle = "#fff";
    ctx.font = (size || 20) + "px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, W / 2, y);
  }

  function drawStartScreen() {
    centeredText("ROCKET // DODGE", H / 2 - 90, 28);
    ctx.save();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2, H / 2 - 50);
    ctx.lineTo(W / 2 + 16, H / 2 - 20);
    ctx.lineTo(W / 2 - 16, H / 2 - 20);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    centeredText("STEER WITH ← → OR A / D", H / 2 + 10, 14);
    centeredText("YOUR SHIP FIRES AUTOMATICALLY", H / 2 + 34, 14);
    centeredText("DODGE ALIENS — CATCH POWERUPS", H / 2 + 58, 14);
    centeredText("PRESS ANY KEY OR CLICK TO START", H / 2 + 96, 13);
    centeredText("BEST " + highScore, H / 2 + 130, 13);
  }

  function drawGameOverScreen() {
    centeredText("GAME OVER", H / 2 - 40, 26);
    centeredText("SCORE " + score, H / 2, 18);
    centeredText("BEST " + highScore, H / 2 + 28, 14);
    centeredText("PRESS ANY KEY OR CLICK TO RETRY", H / 2 + 70, 13);
  }

  var t0 = 0;
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    drawStars(t);

    if (state === STATE_START) {
      drawStartScreen();
      return;
    }

    for (var i = 0; i < aliens.length; i++) drawAlien(aliens[i]);
    for (i = 0; i < bullets.length; i++) drawBullet(bullets[i]);
    for (i = 0; i < powerups.length; i++) drawPowerup(powerups[i]);
    drawParticles();
    drawShip();
    drawHUD();

    if (state === STATE_GAMEOVER) {
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, 0, W, H);
      drawGameOverScreen();
    }
  }

  // ---------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------
  var lastTime = null;
  function loop(timestamp) {
    if (lastTime === null) lastTime = timestamp;
    var dt = Math.min((timestamp - lastTime) / 1000, 0.05); // clamp to avoid huge jumps on tab-switch
    lastTime = timestamp;

    update(dt);
    draw(timestamp / 1000);

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
